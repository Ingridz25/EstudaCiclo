<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><script>try{var t=localStorage.getItem("estudaciclo-tema");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}</script><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EstudaCiclo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#16181d;--muted:#667085;--line:#e6e8ec;--soft:#f1f3f6;--accent:#2d5bff;--red:#d92d20;--redbg:#fef3f2;--yel:#b54708;--yelbg:#fffaeb;--grn:#067647;--grnbg:#ecfdf3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3,h4,button,th,.kpi b,.tab{font-family:'Outfit',system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
header{background:var(--panel);border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 20px;max-width:1200px;margin:0 auto;flex-wrap:wrap}
.top h1{margin:0;font-size:22px}.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.pill{display:inline-flex;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:var(--soft)}
nav{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;max-width:1200px;margin:0 auto;padding:8px 20px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--ink);color:#fff}
main{padding:18px 0 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em}.kpi span{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.g i{background:#079455}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:0}.row .m{flex:1;min-width:180px}.row small,.muted{color:var(--muted);font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:500;color:var(--ink)}
.btn:hover{border-color:#c9ced6}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}button{cursor:pointer}
form.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
input,select,textarea{font:13px 'DM Sans',sans-serif;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tag{font-size:11px;border-radius:99px;padding:2px 8px;background:var(--soft)}.tag.g{background:var(--grnbg);color:var(--grn)}.tag.y{background:var(--yelbg);color:var(--yel)}.tag.b{background:#eef2ff;color:var(--accent)}.tag.r{background:var(--redbg);color:var(--red)}
.timer{font:700 56px/1 'Outfit';letter-spacing:-.02em;text-align:center;padding:14px 0}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-top:1px solid var(--line);font-size:13px}th{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:10px;background:var(--ink);color:#fff;font-size:13px;display:none;z-index:50;max-width:90vw}
#toast.err{background:var(--red)}pre{white-space:pre-wrap;font-size:12px;background:var(--soft);padding:10px;border-radius:8px}
@media(max-width:600px){.timer{font-size:42px}.top{padding:12px}}

/* === refinamento visual === */
:root{--card:var(--panel);--shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.04);--ok:#12b76a;--bad:#f04438}
body{-webkit-font-smoothing:antialiased}
.card{border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:16px;letter-spacing:-.01em;margin-bottom:12px}
.card .card{box-shadow:none;background:#fcfcfd}
.kpi{position:relative;overflow:hidden;padding:14px 14px 12px;box-shadow:var(--shadow);border-radius:14px}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.85}
.kpi b{font-size:28px;line-height:1.1;margin-bottom:2px}.kpi span{font-size:12px;letter-spacing:.01em}
.btn{transition:background .15s,border-color .15s,transform .05s}.btn:hover{background:var(--soft)}.btn:active{transform:translateY(1px)}
.btn.primary:hover{background:#1f4be6}.btn.danger:hover{background:var(--redbg);border-color:#fecdca}
.tab{transition:background .15s,color .15s}.tab:not(.on):hover{background:var(--soft);color:var(--ink)}
.tab.on{background:var(--accent);box-shadow:0 2px 8px rgba(45,91,255,.28)}
.tag{font-weight:500;padding:2px 9px}
.bar{height:9px}.bar i{transition:width .4s ease}
.row{padding:12px 0}.row:hover{background:linear-gradient(90deg,transparent,#fafbfc)}
table{border-collapse:separate;border-spacing:0}th{background:var(--soft);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.04em;padding:9px 10px}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}td{padding:10px}tr:hover td{background:#fafbfc}
.empty{background:#fcfcfd;border-radius:14px;padding:28px}
input,select,textarea{border-radius:10px;padding:8px 10px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,91,255,.15)}
details summary{cursor:pointer;font-weight:500;color:var(--accent)}
/* gráficos de rosca */
.dn{position:relative;width:100%;max-width:230px;aspect-ratio:1;margin:auto}
.dn svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 6px rgba(16,24,40,.08))}
.dn-seg{transition:stroke-width .2s;cursor:pointer}.dn-seg:hover{stroke-width:5.8}
.dn-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.dn-c b{font:700 clamp(24px,3.4vw,34px)/1 'Outfit',sans-serif;letter-spacing:-.02em}.dn-c small{color:var(--muted);font-size:12px;margin-top:3px}
button[data-a=qPerfMatter]{border-radius:10px!important;transition:background .15s}button[data-a=qPerfMatter]:hover{background:var(--soft)!important}
@media(max-width:600px){.card{padding:14px}.kpi b{font-size:24px}}

/* === responsividade e gráficos v2 === */
.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
html{overflow-x:hidden}main{overflow-x:clip}.card,.grid>*,.row>*{min-width:0}
.dn{container-type:inline-size}.dn svg{position:absolute;inset:0;width:100%;height:100%}
.dn-c b{font-size:max(14px,15.5cqw);line-height:1}.dn-c small{font-size:max(10px,7cqw);margin-top:2px}
.split2{display:grid;grid-template-columns:minmax(180px,280px) minmax(0,1fr);gap:24px;align-items:center}
.split3{display:grid;grid-template-columns:minmax(160px,1fr) minmax(0,1.2fr);gap:14px;align-items:center}
.split4{display:grid;grid-template-columns:minmax(130px,1fr) minmax(0,1fr);gap:12px;align-items:center;margin:10px 0}
.split2 .row,.split3 button{overflow-wrap:anywhere}
button.card{font:inherit;color:inherit;width:100%;padding:12px 8px}
.hbars{display:flex;gap:3px;align-items:flex-end;padding-top:4px}
.hb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.hbw{height:120px;width:100%;display:flex;align-items:flex-end}
.hbw i{display:block;width:100%;background:linear-gradient(180deg,#5b82ff,var(--accent));border-radius:5px 5px 0 0}
.hv{font:600 9px/14px 'Outfit',sans-serif;color:var(--ink);height:14px;white-space:nowrap}
.hd{font:600 10px/1 'Outfit',sans-serif;margin-top:5px}.hw{font-size:9px;color:var(--muted);margin-top:1px}
.hb.hoje .hd{color:var(--accent)}.hb.hoje .hbw i{background:var(--accent)}
.f>div{display:flex;gap:8px;flex-wrap:wrap}input[type=date],select{min-height:40px}
@media(max-width:640px){.split2,.split3{grid-template-columns:minmax(0,1fr);gap:14px}.split2 .dn,.split3 .dn{max-width:210px}
 .card{padding:14px}.card .card{padding:12px}.row>div[style*="width:220px"],.row>div[style*="width:200px"]{width:100%!important}
 .wrap{padding:0 12px}.hv{font-size:8px}.hd{font-size:9px}.hbw{height:100px}.tabs{padding:8px 12px}.top{padding:12px}}
@media(max-width:420px){.split4{grid-template-columns:minmax(0,1fr)}.split4 .dn{max-width:180px}}
button.card{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-wrap:anywhere;hyphens:auto}
button.card .dn{width:112px;height:112px;min-width:112px;max-width:112px;aspect-ratio:auto;flex:none;margin:0 auto}button.card b{font-size:12.5px;line-height:1.3;margin-top:8px!important}button.card small{font-size:11px;color:var(--muted)}

/* === logotipo e tema claro/escuro === */
.logo{margin:0;line-height:0}.logo img{height:78px;width:auto;display:block}
.logo .l-dark{display:none}[data-theme=dark] .logo .l-light{display:none}[data-theme=dark] .logo .l-dark{display:block;mix-blend-mode:screen;filter:contrast(1.25)}
.logo .l-light{mix-blend-mode:multiply}
.topr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:7px}.tbtn svg{width:16px;height:16px}
input,select,textarea{background:var(--panel);color:var(--ink)}
[data-theme=dark]{color-scheme:dark;--bg:#0e1013;--panel:#161a20;--card:#161a20;--ink:#eef0f3;--muted:#98a2b3;--line:#2a303a;--soft:#1f252d;--redbg:#3b1b19;--yelbg:#3a2b10;--grnbg:#10301f;--grn:#47cd89;--red:#f97066;--yel:#fdb022;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25)}
[data-theme=dark] nav{background:rgba(14,16,19,.92)}
[data-theme=dark] .card .card,[data-theme=dark] .empty{background:#12161b}
[data-theme=dark] .row:hover{background:linear-gradient(90deg,transparent,#1a1f26)}[data-theme=dark] tr:hover td{background:#1a1f26}
[data-theme=dark] .tag.b{background:rgba(91,130,255,.18);color:#9db4ff}
[data-theme=dark] .btn:hover{border-color:#3a4250}[data-theme=dark] .btn.danger:hover{border-color:#6b2b27}
[data-theme=dark] .tab.on{box-shadow:0 2px 10px rgba(45,91,255,.4)}
[data-theme=dark] [style*="#eef2ff"]{background:rgba(91,130,255,.14)!important}
[data-theme=dark] .bar i,[data-theme=dark] .hbw i{filter:brightness(1.1)}
[data-theme=dark] .dn svg{filter:drop-shadow(0 2px 8px rgba(0,0,0,.45))}
@media(max-width:640px){.logo img{height:60px}}

<script>
/* ===== 1. PERSISTÊNCIA (IndexedDB, registro único e atômico; fallback localStorage) ===== */
const DB='estudaciclo',KEY='state',SCHEMA=1;
let _db;const idb=()=>_db||(_db=new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
async function dbLoad(){try{const d=await idb();return await new Promise((ok,no)=>{const q=d.transaction('kv').objectStore('kv').get(KEY);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}catch(e){try{return JSON.parse(localStorage.getItem(DB)||'null')}catch(_){return null}}}
async function dbSave(obj){const copy=JSON.parse(JSON.stringify(obj));try{const d=await idb();await new Promise((ok,no)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(copy,KEY);t.oncomplete=ok;t.onerror=t.onabort=()=>no(t.error)})}catch(e){localStorage.setItem(DB,JSON.stringify(copy))}}
/* ===== 2. UTILITÁRIOS ===== */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),now=()=>new Date().toISOString();
const ymd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),today=()=>ymd(new Date());
const hm=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h${String(m).padStart(2,'0')}`:`${m}min`};
const clock=ms=>{const s=Math.floor(ms/1e3);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')};
const norm=s=>s.trim().replace(/\s+/g,' ').toLowerCase();
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',err?6000:2500)}
const weekStart=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
/* ===== 3. ESTADO E REGRAS DE NEGÓCIO ===== */
const blank=()=>({schema:SCHEMA,materias:[],assuntos:[],ciclos:[],sessoes:[],revisoes:[],questoes:[],sessoesQuestoes:[],blocos:[],config:{metaDia:120,metaSemana:600,metaMes:2400,revDias:[1,7,15,30,60,90],revAuto:true,studyCycle:{subjectIds:[],currentIndex:0,weekStart:'',extensionDate:null,lastCompletedAt:null},weekly:{availability:{1:90,2:90,3:90,4:90,5:90,6:90,7:0},weeklyGoalMinutes:540,focusSubjectId:null},weekSnapshots:{},legacyOriginalStores:null},timer:null});
let S=blank(),ui={tab:'dash',ed:{},cic:null,imp:null,filt:{}};
const mat=id=>S.materias.find(m=>m.id===id),ass=id=>S.assuntos.find(a=>a.id===id);
const secBy=f=>S.sessoes.filter(f).reduce((t,s)=>t+s.duracao,0);
const secMat=id=>secBy(s=>s.materiaId===id),secAss=id=>secBy(s=>s.assuntoId===id);
const pct=(a,b)=>b?Math.round(a/b*100):0;
const progMat=id=>{const l=S.assuntos.filter(a=>a.materiaId===id);return{n:l.length,c:l.filter(a=>a.status==='concluido').length,p:pct(l.filter(a=>a.status==='concluido').length,l.length)}};
async function commit(fn,msg){const bak=JSON.stringify(S);try{fn();await dbSave(S);if(msg)toast(msg)}catch(e){S=JSON.parse(bak);toast('Não foi possível salvar. Nada foi alterado. '+e.message,true)}render()}
function scheduleStudyReviews(session){
 if(!session||!session.assuntoId||!ass(session.assuntoId)||!S.config.revAuto)return;
 const topicId=session.assuntoId,studyId=session.id,baseDate=session.data||today(),stamp=now();
 // Só a programação do estudo mais recente do tópico fica pendente; revisões concluídas são imutáveis.
 S.revisoes.forEach(r=>{if(r.assuntoId===topicId&&r.auto&&r.status==='prevista'&&r.studySessionId&&r.studySessionId!==studyId){r.status='substituida';r.atualizadoEm=stamp;r.obs=(r.obs?r.obs+' · ':'')+'Substituída por novo registro de estudo.'}});
 (S.config.revDias||[1,7,15,30,60,90]).forEach(offset=>{
  const d=new Date(baseDate+'T12:00:00');d.setDate(d.getDate()+offset);const date=ymd(d);
  const id=studyId+':D+'+offset;
  if(!S.revisoes.some(r=>r.id===id))S.revisoes.push({id,assuntoId:topicId,data:date,tipo:'Revisão D+'+offset,min:0,obs:session.origem==='estudo_anterior'?'Agendada a partir de estudo anterior informado pelo usuário.':'',status:'prevista',auto:true,origem:session.origem||'sessao',studySessionId:studyId,offset,originalDate:date,completedDate:null,rescheduleHistory:[],criadoEm:stamp,atualizadoEm:stamp});
 });
}
function scheduleReviews(a){if(!a)return;const session={id:uid('study'),assuntoId:a.id,data:today()};scheduleStudyReviews(session)}
const elapsed=()=>S.timer?S.timer.acc+(S.timer.running&&S.timer.phase!=='break'?Date.now()-S.timer.t0:0):0;
function cleanCycles(){S.ciclos.forEach(c=>{c.itens=c.itens.filter(i=>mat(i.materiaId));if(c.pos>=c.itens.length)c.pos=0})}
/* ===== 4. VALIDAÇÃO / BACKUP ===== */
const TYPES={materias:{id:'string',nome:'string',cor:'string',prioridade:'number',peso:'number',ativa:'boolean'},assuntos:{id:'string',materiaId:'string',nome:'string',ordem:'number',status:'string'},ciclos:{id:'string',nome:'string',itens:'object',pos:'number'},sessoes:{id:'string',materiaId:'string',data:'string',duracao:'number',tipo:'string'},revisoes:{id:'string',assuntoId:'string',data:'string',status:'string'}};
const STATUS=['nao_iniciado','em_andamento','concluido','pausado'],RSTAT=['prevista','realizada','adiada','cancelada','substituida'];
function validate(d){const er=[];if(!d||typeof d!=='object'||Array.isArray(d))return['O conteúdo não é um objeto de dados.'];
 for(const k in TYPES){if(!Array.isArray(d[k])){er.push(`Lista "${k}" ausente ou inválida.`);continue}const ids=new Set();

A.blockDone=v=>{const b=S.blocos.find(x=>x.id===v);if(b.data>today())return toast('Só é possível concluir blocos de hoje ou de datas anteriores.',true);const raw=prompt('Quantos minutos você realizou?',String(b.min));if(raw===null)return;const n=+raw;if(!Number.isInteger(n)||n<1||n>720)return toast('Informe de 1 a 720 minutos realizados.',true);commit(()=>{b.status='concluido';b.realMin=n;b.actualMinutes=n;b.updatedAt=now();b.statusHistory=b.statusHistory||[];b.statusHistory.push({status:'concluido',actualMinutes:n,changedAt:now()});const study={id:uid('ses'),materiaId:b.materiaId,assuntoId:b.assuntoId||'',data:b.data,ini:'08:00',fim:'08:00',duracao:n*60,tipo:b.tipo,obs:'Concluído a partir do planejamento semanal',status:'concluida'};S.sessoes.push(study);scheduleStudyReviews(study)},'Bloco concluído e sessão registrada.')};A.blockMiss=v=>{const b=S.blocos.find(x=>x.id===v);if(b.data>today())return toast('Só é possível marcar blocos de hoje ou de datas anteriores.',true);commit(()=>{b.status='nao_realizado';b.actualMinutes=0;b.updatedAt=now();b.statusHistory=b.statusHistory||[];b.statusHistory.push({status:'nao_realizado',changedAt:now()})},'Bloco marcado como não realizado.')};A.blockReopen=v=>commit(()=>{const b=S.blocos.find(x=>x.id===v);b.status='planejado';b.actualMinutes=null;b.updatedAt=now();b.statusHistory=b.statusHistory||[];b.statusHistory.push({status:'planejado',changedAt:now()})},'Bloco reaberto.');A.blockDel=v=>{if(confirm('Remover este bloco do planejamento? O registro será preservado no histórico de auditoria.'))commit(()=>{const b=S.blocos.find(x=>x.id===v);if(b){b.status='removido';b.removedAt=now();b.updatedAt=now();b.statusHistory=b.statusHistory||[];b.statusHistory.push({status:'removido',changedAt:now()})}},'Bloco removido do planejamento.')};A.blockEdit=v=>{const b=S.blocos.find(x=>x.id===v);if(!b||b.status!=='planejado')return toast('Somente blocos planejados podem ser editados.',true);const d=prompt('Data (AAAA-MM-DD):',b.data);if(d===null)return;const mid=prompt('ID da matéria (consulte a aba Matérias):',b.materiaId);if(mid===null)return;const aid=prompt('ID do assunto ou vazio para nenhum:',b.assuntoId||'');if(aid===null)return;const tipo=prompt('Tipo: Estudo, Revisão ou Questões',b.tipo);if(tipo===null)return;const min=prompt('Duração em minutos (5 a 600):',b.min);if(min===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!mat(mid)||!(+min>=5&&+min<=600)||!['Estudo','Revisão','Questões'].includes(tipo)||(aid&&(!ass(aid)||ass(aid).materiaId!==mid)))return toast('Data, matéria, assunto, tipo ou duração inválidos.',true);commit(()=>{b.data=d;b.materiaId=mid;b.assuntoId=aid;b.tipo=tipo;b.min=+min;b.weekStart=(()=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return ymd(x)})();b.updatedAt=now()},'Bloco atualizado.')};
A.qDate=v=>{const q=S.questoes.find(x=>x.id===v),d=prompt('Data real da resolução (AAAA-MM-DD). Deixe vazio se não souber:',q.respondidaEm||'');if(d===null)return;if(d&&!/^\d{4}-\d{2}-\d{2}$/.test(d))return toast('Data inválida.',true);commit(()=>{q.respondidaEm=d},'Data de resolução atualizada.')};A.qStatus=v=>{const q=S.questoes.find(x=>x.id===v);if(!q)return;const next=prompt('Novo status: correct, incorrect ou pending',q.status);if(next===null)return;if(!['correct','incorrect','pending'].includes(next))return toast('Status inválido.',true);commit(()=>{q.status=next},'Status da questão atualizado.')};A.qSessDel=v=>{if(confirm('Excluir esta sessão agregada de questões?'))commit(()=>{S.sessoesQuestoes=S.sessoesQuestoes.filter(x=>x.id!==v)},'Sessão agregada excluída.')};
A.weekPrev=()=>{ui.weekOffset=(ui.weekOffset||0)-1;render()};A.weekNext=()=>{ui.weekOffset=(ui.weekOffset||0)+1;render()};A.weekNow=()=>{ui.weekOffset=0;render()};A.qPeriod=v=>{ui.qPeriod=+v;render()};A.qPerfPeriod=v=>{ui.qPerfPeriod=v;render()};A.qPerfView=v=>{ui.qPerfView=v;render()};A.qPerfMatter=v=>{ui.qPerfMatter=v||null;render()};A.qMat=v=>{ui.qMat=v;render()};A.qAss=v=>{ui.qAss=v;render()};
F.weekCfg=f=>{const goal=+f.goal,availability={};for(let i=1;i<=7;i++){const n=+f['d'+i];if(!Number.isInteger(n)||n<0||n>720)return toast('Disponibilidade diária deve ficar entre 0 e 720 minutos.',true);availability[i]=n}const total=Object.values(availability).reduce((a,b)=>a+b,0);if(!Number.isInteger(goal)||goal<0||goal>total)return toast(`Meta semanal inválida: deve ficar entre 0 e ${total} minutos disponíveis.`,true);if(f.focus&&!mat(f.focus))return toast('Matéria foco inválida.',true);const ws=(()=>{const d=new Date(isoWeekStart()+'T12:00:00');d.setDate(d.getDate()+(ui.weekOffset||0)*7);return ymd(d)})();commit(()=>{S.config.weekly={weeklyGoalMinutes:goal,availability,focusSubjectId:f.focus||null};S.config.metaSemana=goal;S.config.weekSnapshots=S.config.weekSnapshots||{};S.config.weekSnapshots[ws]={weeklyGoalMinutes:goal,availability:{...availability},focusSubjectId:f.focus||null,createdAt:S.config.weekSnapshots[ws]?.createdAt||now(),updatedAt:now()}},'Disponibilidade semanal salva.')};F.block=f=>{if(!mat(f.materiaId))return toast('Selecione uma matéria.',true);if(f.assuntoId&&(!ass(f.assuntoId)||ass(f.assuntoId).materiaId!==f.materiaId))return toast('Assunto incompatível.',true);if(!/^\d{4}-\d{2}-\d{2}$/.test(f.data)||+f.min<5||+f.min>600)return toast('Data ou duração inválida.',true);commit(()=>{const ws=(()=>{const d=new Date(f.data+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)})();S.config.weekSnapshots=S.config.weekSnapshots||{};if(!S.config.weekSnapshots[ws])S.config.weekSnapshots[ws]={...S.config.weekly,availability:{...S.config.weekly.availability},createdAt:now(),updatedAt:now()};const weekStart=(()=>{const d=new Date(f.data+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)})();S.blocos.push({id:uid('bl'),data:f.data,weekStart,materiaId:f.materiaId,assuntoId:f.assuntoId||'',tipo:f.tipo,min:+f.min,status:'planejado',realMin:0,actualMinutes:null,obs:f.obs.trim(),statusHistory:[],createdAt:now(),updatedAt:now()})},'Bloco adicionado ao planejamento.')};F.qSess=f=>{const n=+f.resolvidas,a=+f.acertos;if(!mat(f.materiaId)||!Number.isInteger(n)||n<1||n>999||!Number.isInteger(a)||a<0||a>n||!/^\d{4}-\d{2}-\d{2}$/.test(f.data)||f.data>today())return toast('Confira matéria, data, resolvidas e acertos.',true);if(f.assuntoId&&ass(f.assuntoId).materiaId!==f.materiaId)return toast('O assunto não pertence à matéria.',true);commit(()=>S.sessoesQuestoes.push({id:uid('qs'),materiaId:f.materiaId,assuntoId:f.assuntoId||'',data:f.data,plataforma:f.plataforma.trim(),resolvidas:n,acertos:a,criadoEm:now()}),'Sessão de questões registrada.')};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&b.tagName==='BUTTON'&&A[b.dataset.a])A[b.dataset.a](b.dataset.v,b)});
document.addEventListener('change',e=>{if(e.target.matches('select[data-a=qPeriod]')){A.qPeriod(e.target.value);return}if(e.target.matches('select[data-a=qMat]')){A.qMat(e.target.value);return}if(e.target.matches('select[data-a=qAss]')){A.qAss(e.target.value);return}if(e.target.matches('select[data-a=matChg]'))A.matChg(null,e.target);if(e.target.id==='fileQ'&&e.target.files[0])readQ(e.target.files[0]);if(e.target.matches('[data-a=qFilt]')){ui.qf=e.target.value;render();const x=document.querySelector('[data-a=qFilt]');x.focus();x.setSelectionRange(x.value.length,x.value.length)}if(e.target.id==='fileEdital'&&e.target.files[0])readEdital(e.target.files[0]);if(e.target.id==='file'&&e.target.files[0])readBackup(e.target.files[0])});
document.addEventListener('submit',e=>{const f=e.target.dataset.f;if(!f)return;e.preventDefault();const o={};new FormData(e.target).forEach((v,k)=>o[k]=v);if(e.target.querySelector('[type=checkbox]'))e.target.querySelectorAll('[type=checkbox]').forEach(c=>o[c.name]=c.checked);F[f](o)});

 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();render()})();
